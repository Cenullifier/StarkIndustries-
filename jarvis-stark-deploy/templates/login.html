<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>STARK INDUSTRIES // Secure Access</title>
<style>
:root{color-scheme:dark;--bg:#06101b;--panel:#0b1c2b;--line:#24516b;--cyan:#43d7ff;--muted:#88a8be}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(ellipse at 50% 30%,#10364c 0%,var(--bg) 58%,#02070d 100%);font-family:Inter,Segoe UI,system-ui,sans-serif;color:#e6f4ff}.card{width:min(440px,100%);padding:32px;border:1px solid var(--line);border-radius:20px;background:rgba(7,20,33,.97);box-shadow:0 20px 80px #0009,0 0 45px #16b8e822;text-align:center}.emblem{width:76px;height:76px;margin:0 auto 20px;border:1px solid var(--cyan);border-radius:50%;display:grid;place-items:center;color:var(--cyan);font-size:28px;box-shadow:0 0 30px #16b8e833}.eyebrow{font-size:10px;letter-spacing:.2em;color:#6f9db6;font-weight:750}h1{font-size:24px;letter-spacing:.06em;margin:12px 0}p{font-size:12px;line-height:1.7;color:var(--muted)}form{display:grid;gap:12px;margin-top:22px}input,button{font:inherit;border-radius:10px;padding:13px}input{background:#061421;border:1px solid var(--line);color:#e6f4ff;outline:none}input:focus{border-color:var(--cyan)}button{border:0;background:var(--cyan);color:#03131e;font-size:11px;font-weight:800;letter-spacing:.06em;cursor:pointer}.error{color:#ff6f7d;min-height:18px;font-size:12px}
</style></head>
<body><main class="card"><div class="emblem">◈</div><div class="eyebrow">STARK INDUSTRIES // AUTHENTICATION</div><h1>SECURE ACCESS</h1><p>Identity verification required before entering the J.A.R.V.I.S. personal system.</p><form method="post" action="/login"><input name="password" type="password" autocomplete="current-password" placeholder="Enter passphrase" aria-label="Passphrase" required autofocus><button type="submit">AUTHENTICATE ↗</button><div class="error" role="status">{{ error }}</div></form><p>Private session · Sign in to continue</p></main></body></html>
